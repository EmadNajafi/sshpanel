{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h1>Administrator sign in</h1>
  {% if form.errors %}<p class="notice error">Invalid username or password.</p>{% endif %}
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
