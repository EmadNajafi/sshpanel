{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSH VPN Panel</title>
  <link rel="stylesheet" href="{% static 'panel.css' %}">
</head>
<body>
  <header><strong>SSH VPN Panel</strong>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>{% endif %}</header>
  <main>
    {% for message in messages %}<div class="notice {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
